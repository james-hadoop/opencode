db_config:
  mysql:
    host: localhost
    port: 3306
    user: dev
    password: "dEv#1234"
    database: app
    charset: utf8mb4
    driver: mysql+pymysql
    table: t_app_article_toutiao_article_downloader
    sql: >-
      SELECT id, article_id, title, source, url, abstract, content, images, category, publish_time, created_at, created_by, updated_at, updated_by, source_type
      FROM (
        SELECT id, article_id, title, source, url, abstract, content, images, category, publish_time, created_at, created_by, updated_at, updated_by, 'toutiao' as source_type
        FROM app.t_app_article_toutiao_article_downloader
        UNION ALL
        SELECT id, article_id, title, source, url, abstract, content, images, category, publish_time, created_at, created_by, updated_at, updated_by, 'weibo' as source_type
        FROM app.t_app_article_weibo_hot
        UNION ALL
        SELECT id, article_id, title, source, url, abstract, content, images, category, publish_time, created_at, created_by, updated_at, updated_by, 'bilibili' as source_type
        FROM app.t_app_article_zhihu_hot
      ) as all_articles
      ORDER BY created_at desc, category
      LIMIT 100
      ;

